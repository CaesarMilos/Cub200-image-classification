# 文件作用：最小消融实验模板。
# A: attention=false, ema=false, evaluate without --tta
# B: attention=true,  ema=false, evaluate without --tta
# C: attention=true,  ema=true,  evaluate without --tta
# D: 使用 C 的同一 checkpoint，再执行 evaluate.py --tta；无需重新训练。
data:
  raw_dir: "E:/Datasets/CUB_200_2011"
  artifacts_dir: "E:/Datasets/CUB_200_2011/artifacts"
  val_ratio: 0.10
  num_workers: 8
  batch_size: 32
  pin_memory: true
model:
  name: convnext_attention
  num_classes: 200
  pretrained: true
  attention_pooling: true
  dropout: 0.3
  hidden_dim: 1024
  custom_channels: [64, 128, 256, 512]
preprocess:
  image_size: 224
  resize_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  random_resized_crop: true
  crop_scale: [0.6, 1.0]
  horizontal_flip: 0.5
  random_rotation: 0.0
  color_jitter: 0.0
  randaugment_ops: 2
  randaugment_magnitude: 9
  random_erasing: 0.25
training:
  epochs: 100
  seed: 42
  optimizer: adamw
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr_ratio: 0.02
  freeze_backbone_epochs: 0
  amp: true
  ema: true
  ema_decay: 0.9999
  grad_clip: 1.0
  selection_metric: accuracy
  deterministic: true
evaluation:
  tta_horizontal_flip: false
  top_k: 3
output:
  root_dir: "E:/Models/CUB_200_Classification"
  experiment_name: "ablation_c_attention_ema"

