# 文件作用：从零训练自定义 Multi-Scale SE-Residual CNN。
data:
  raw_dir: "data/CUB_200_2011"
  artifacts_dir: "data/artifacts"
  val_ratio: 0.10
  num_workers: 8
  batch_size: 64
  pin_memory: true
model:
  name: custom_cnn
  num_classes: 200
  pretrained: false
  attention_pooling: false
  dropout: 0.35
  hidden_dim: 1024
  custom_channels: [64, 128, 256, 512]  # 四个层级通道数，必须为偶数。
preprocess:
  image_size: 224
  resize_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  random_resized_crop: true
  crop_scale: [0.65, 1.0]
  horizontal_flip: 0.5
  random_rotation: 10.0
  color_jitter: 0.10
  randaugment_ops: 0
  randaugment_magnitude: 9
  random_erasing: 0.15
training:
  epochs: 120
  seed: 42
  optimizer: adamw
  backbone_lr: 0.0003
  head_lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr_ratio: 0.02
  freeze_backbone_epochs: 0
  amp: true
  ema: true
  ema_decay: 0.9999
  grad_clip: 1.0
  selection_metric: accuracy
  deterministic: true
evaluation:
  tta_horizontal_flip: false
  top_k: 3
output:
  root_dir: "outputs"
  experiment_name: "custom_cnn_v2"

