# 文件作用：ResNet-50 ImageNet 迁移学习基线配置。
data:
  raw_dir: "data/CUB_200_2011"
  artifacts_dir: "data/artifacts"
  val_ratio: 0.10
  num_workers: 8
  batch_size: 32
  pin_memory: true
model:
  name: resnet50
  num_classes: 200
  pretrained: true
  attention_pooling: false
  dropout: 0.5
  hidden_dim: 1024
  custom_channels: [64, 128, 256, 512]
preprocess:
  image_size: 448       # 高分辨率保留鸟喙与羽毛细节；显存不足时调至 320/224。
  resize_size: 512
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  random_resized_crop: true
  crop_scale: [0.70, 1.0]
  horizontal_flip: 0.5
  random_rotation: 15.0
  color_jitter: 0.10
  randaugment_ops: 0
  randaugment_magnitude: 9
  random_erasing: 0.0
training:
  epochs: 40
  seed: 42
  optimizer: adamw
  backbone_lr: 0.00005
  head_lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr_ratio: 0.02
  freeze_backbone_epochs: 5  # 前 5 轮只训练分类头，之后全量微调。
  amp: true
  ema: false
  ema_decay: 0.9999
  grad_clip: 1.0
  selection_metric: accuracy
  deterministic: true
evaluation:
  tta_horizontal_flip: false
  top_k: 3
output:
  root_dir: "outputs"
  experiment_name: "resnet50_v2"

